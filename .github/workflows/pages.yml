name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Piccola pausa: l'artifact a volte non è ancora visibile all'API subito dopo
      # l'upload, e deploy-pages fallisce con "No artifacts found" (ritardo noto
      # di propagazione lato GitHub, non un problema nostro).
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
